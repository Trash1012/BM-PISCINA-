<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B&M Piscinas | Calidad que fluye en cada proyecto.</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --aqua: #00f5ff;
            --deep-ocean: #002b49;
            --glass: rgba(255, 255, 255, 0.03);
            --text-light: #f0faff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #2f4a56;
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* Forzar que todo el texto sea blanco */
        body, body * {
            color: #ffffff !important;
        }

        /* Placeholders en blanco por defecto */
        ::placeholder { color: #ffffff !important; opacity: 1; }

        /* HERO */
        .hero {
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero-video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            filter: brightness(1.15) saturate(1.2) contrast(1.05);
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(0,18,26,0.15), rgba(0,18,26,0.55));
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero-content h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(4rem, 10vw, 7rem);
            color: var(--aqua);
            margin-bottom: 20px;
            line-height: 0.95;
            letter-spacing: 3px;
            font-weight: 700;
        }

        .hero-content p {
            color: var(--aqua);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: clamp(1.2rem, 2.4vw, 1.9rem);
            font-weight: 500;
        }

        .hero-content .btn-container {
            margin-top: 28px;
            display: flex;
            justify-content: center;
        }

        /* BOTÓN GENERAL */
        .btn-outline {
            border: 1px solid var(--aqua);
            color: var(--aqua);
            padding: 12px 28px;
            border-radius: 40px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: 0.3s;
            cursor: pointer;
        }

        .btn-outline:hover {
            background: var(--aqua);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 245, 255, 0.3);
        }

        .btn-outline:hover * {
            color: #00121a !important;
        }

        /* 🟢 BOTÓN FLOTANTE DE WHATSAPP */
        .whatsapp-floating {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 64px;
            height: 64px;
            background-color: #25D366;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            z-index: 9999;
            transition: transform 0.3s ease, background-color 0.3s ease;
            text-decoration: none;
        }

        .whatsapp-floating:hover {
            transform: scale(1.1);
            background-color: #20ba5a;
        }

        .whatsapp-floating svg {
            width: 34px;
            height: 34px;
            fill: #ffffff;
        }

        /* 🔴 GLOBO DE NOTIFICACIÓN ROJO */
        .whatsapp-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background-color: #ff3b30;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* SERVICIOS Y DIAPOSITIVAS */
        .services {
            padding: 100px 5%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
        }

        .service-card {
            height: 450px;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(0,245,255,0.2);
            transition: 0.4s;
        }

        .service-card:hover {
            transform: translateY(-10px);
        }

        /* Contenedor del carrusel interno */
        .slides-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Estilo para cada imagen del carrusel */
        .slide-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        /* Clase activa para mostrar la imagen actual */
        .slide-img.active {
            opacity: 1;
        }

        .card-overlay {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 30px;
            background: linear-gradient(
                to top,
                rgba(0,18,26,0.95),
                transparent
            );
            z-index: 1;
        }

        .card-overlay h3 {
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        /* CONTACTO */
        .contact-section {
            padding: 80px 5%;
            display: flex;
            justify-content: center;
        }

        .contact-container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            color: #072632;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(2,8,23,0.06);
            box-shadow: 0 10px 40px rgba(2,8,23,0.08);
            min-height: 300px;
            height: auto;
        }

        #hubspot-form-target {
            width: 100%;
            min-height: 500px;
        }

        #hubspot-form-target input,
        #hubspot-form-target textarea,
        #hubspot-form-target select {
            background: #fbfeff;
            border: 1px solid rgba(2,8,23,0.08);
            color: #072632;
            padding: 12px;
            border-radius: 10px;
            outline: none;
            width: 100%;
        }

        #hubspot-form-target input:focus,
        #hubspot-form-target textarea:focus,
        #hubspot-form-target select:focus {
            border-color: var(--aqua);
            box-shadow: 0 0 10px rgba(0,245,255,0.3);
        }

        /* FOOTER OPTIMIZADO */
        footer {
            padding: 60px 5% 40px 5%;
            background: rgba(0, 18, 26, 0.4);
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .footer-nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 35px;
        }

        .footer-nav a {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .footer-nav a:hover {
            color: var(--aqua) !important;
        }

        .footer-social {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .footer-social a {
            color: var(--aqua);
            transition: 0.3s;
        }

        .footer-social a:hover {
            color: white;
            transform: translateY(-4px);
        }

        .footer-social svg {
            width: 33px;
            height: 33px;
            display: block;
        }

        .footer-copy {
            font-size: 0.85rem;
            opacity: 0.6;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        @media(max-width:768px) {
            .footer-nav {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }
            .whatsapp-floating {
                bottom: 20px;
                right: 20px;
                width: 56px;
                height: 56px;
            }
            .whatsapp-floating svg {
                width: 28px;
                height: 28px;
            }
        }
    </style>
</head>

    <script src="https://js.hsforms.net/forms/embed/v2.js"></script>
    <script>
        // Configuración de Video
        const BANNER_VIDEO = 'video.mp4';
        const video = document.getElementById('hero-video');
        video.src = BANNER_VIDEO;
        video.load();

        function tryPlay() {
            video.play().catch(() => {
                document.addEventListener('click', () => video.play(), { once: true });
            });
        }

        video.addEventListener('canplaythrough', tryPlay, { once: true });
        video.addEventListener('stalled', () => {
            const t = video.currentTime;
            video.load();
            video.currentTime = t;   
            tryPlay();
        });
        video.addEventListener('pause', () => {
            if (!video.ended && video.readyState >= 3) {
                video.play().catch(() => {});
            }
        });

        // Lógica de Carruseles Automáticos
        const carousels = document.querySelectorAll('[data-carousel]');

        carousels.forEach(carousel => {
            const slides = carousel.querySelectorAll('.slide-img');
            let currentSlideIndex = 0;

            // Si hay 1 o 0 imágenes, se queda fija y no da error
            if (slides.length <= 1) return;

            setInterval(() => {
                slides[currentSlideIndex].classList.remove('active');
                currentSlideIndex = (currentSlideIndex + 1) % slides.length;
                slides[currentSlideIndex].classList.add('active');
            }, 4000);
        });

        lucide.createIcons();

        // Formulario HubSpot
        hbspt.forms.create({
            region: "na1",
            portalId: "51471205",
            formId: "d79e0f10-eb42-44dd-8440-1f68ec2755dd",
            target: "#hubspot-form-target"
        });
    </script>
